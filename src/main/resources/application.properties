spring.application.name=tikcoin
server.port=${PORT:8082}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — generate with SecretKeyGenerator.java (Base64-encoded 32+ byte key)
app.jwt.secret=${JWT_SECRET}

# TikTok OAuth2 — from your TikTok developer console
tiktok.client-key=${TIKTOK_CLIENT_KEY}
tiktok.client-secret=${TIKTOK_CLIENT_SECRET}