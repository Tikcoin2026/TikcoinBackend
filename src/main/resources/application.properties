spring.application.name=tikcoin
server.port=${PORT:8082}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET}


tiktok.client-key=${TIKTOK_CLIENT_KEY}
tiktok.client-secret=${TIKTOK_CLIENT_SECRET}

paystack.secret-key=${PAYSTACK_SECRET_KEY}

firebase.service-account-base64=${FIREBASE_SERVICE_ACCOUNT_BASE64:}

# Web app callback URL — where the Next.js app handles the TikTok OAuth code
app.web.callback-url=${WEB_CALLBACK_URL:http://localhost:3000/auth/callback}

# Email (Gmail SMTP) — set these env vars to enable email notifications
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true