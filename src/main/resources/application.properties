spring.application.name=tikcoin
server.port=${PORT:8082}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET}


tiktok.client-key=${TIKTOK_CLIENT_KEY}
tiktok.client-secret=${TIKTOK_CLIENT_SECRET}

paystack.secret-key=${PAYSTACK_SECRET_KEY}

firebase.service-account-base64=${FIREBASE_SERVICE_ACCOUNT_BASE64:}